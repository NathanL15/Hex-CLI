ShortDescription: Local Hexagon NPU terminal agent for Snapdragon X Elite Windows ARM64
Description: |-
  Hex CLI is a local agentic terminal assistant that runs entirely on-device using the
  Snapdragon X Elite Hexagon NPU via the open-source npurun runtime. It supports three
  interaction modes (autopilot, chat, command-only), a full tool suite (file I/O,
  PowerShell execution, semantic memory, syntax verification, code execution), persistent
  cross-session semantic memory with a self-consolidating dreaming daemon, cloud escalation
  fallback via the Anthropic API with secret redaction, and named session checkpoints.
  No cloud dependency for normal use; stdlib + NumPy + ONNX Runtime only.
