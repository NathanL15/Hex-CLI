[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexcli"
dynamic = ["version"]
description = "Local Hexagon NPU terminal agent for Snapdragon X Elite Windows ARM64"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "agent", "arm64", "snapdragon", "npu", "terminal", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[project.scripts]
hex = "hexcli.launcher:main"
hexcli = "hexcli.agent:main"

[project.urls]
Homepage = "https://github.com/NathanL15/Hex-CLI"
Repository = "https://github.com/NathanL15/Hex-CLI"
"Bug Tracker" = "https://github.com/NathanL15/Hex-CLI/issues"

[tool.hatch.version]
path = "hexcli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hexcli"]

# What a person downloads: the package, the installer and its wrappers, the
# example config, and the two documents worth reading. The eval harness,
# the research notes and the paper stay in the repository.
[tool.hatch.build.targets.sdist]
include = [
    "hexcli/",
    "launcher.py",
    "shellai.py",
    "Hex CLI.cmd",
    "shellai.cmd",
    "install.ps1",
    "shellai.example.json",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# prompts.py is prompt TEXT, where whitespace is part of the payload the model
# reads. One rule contains a trailing space before a line break (a `\n` written
# inside a non-raw string, so it became a real newline). Auto-stripping it
# would silently change the tuned prompt, so whitespace lint is off here.
# Do not "clean up" this file — edit it only against evals/cases_extended.py.
"hexcli/prompts.py" = ["W291", "W293"]
