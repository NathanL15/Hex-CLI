name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # hexcli is Windows-only by design (msvcrt, PowerShell tool dispatch),
    # so the offline suites must run on a Windows runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy onnxruntime ruff

      - name: Syntax compile gate
        run: python -m compileall hexcli/ evals/ -q

      - name: ruff check
        run: ruff check hexcli/ evals/

      - name: Unit tests — v1.1 suite
        run: python evals/test_v11.py

      - name: Integration tests — eval v2 instrument (mock backend)
        run: python evals/test_runner.py

      - name: Unit tests — v2 protocol + shell session
        run: python evals/test_protocol_v2.py

      - name: Unit tests — v2 back-ports into the v1 protocol
        run: python evals/test_backports.py

      - name: Unit tests — context budget + deterministic compaction
        run: python evals/test_context_budget.py

      - name: Unit tests — local escalation ladder
        run: python evals/test_escalation.py

      - name: Unit tests — injection defense (sensitive-command gate)
        run: python evals/test_injection_defense.py

      - name: Unit tests — live stream rendering
        run: python evals/test_stream_render.py

      - name: Unit tests — workspace write-scoping
        run: python evals/test_write_scope.py

      - name: Unit tests — product shell (diffs, AGENTS.md, doctor)
        run: python evals/test_product_shell.py

      - name: Unit tests — input line (history, completion, multi-line)
        run: python evals/test_lineedit.py

      - name: Integration tests — v2 agent loop (mock backend)
        run: python evals/test_loop_v2.py

      - name: Unit tests — core coverage backfill
        run: python evals/test_core.py

      - name: Integration tests — agent loop (mock backend)
        run: python evals/test_agent_loop.py

      - name: Unit tests — v1.2 suite
        run: python evals/test_v12.py

      - name: Unit tests — v1.3 suite
        run: python evals/test_v13.py

      - name: Unit tests — v1.4 suite
        run: python evals/test_v14.py

      - name: Unit tests — v1.5 suite
        run: python evals/test_v15.py

      - name: Unit tests — v1.6 suite
        run: python evals/test_v16.py

      - name: Unit tests — installer + launcher discovery
        run: python evals/test_installer.py

      - name: Unit tests — custom slash commands
        run: python evals/test_commands.py

      - name: Unit tests — /setup wizard
        run: python evals/test_setup_wizard.py

      - name: Unit tests — prompt split (direct stage + router)
        run: python evals/test_prompt_split.py

      - name: Unit tests — per-step tool-output budget + grader fixes
        run: python evals/test_tool_budget.py
      - name: chat log
        run: python evals/test_chatlog.py
