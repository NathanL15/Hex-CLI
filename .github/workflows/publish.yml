name: Publish

# Builds the wheel and the source distribution, attaches both to the GitHub
# release, and publishes them to PyPI. Runs when a release is published
# (RELEASING.md step 4, after CI is green on the tag) and by hand for a tag
# that was released before this workflow existed.
#
# PyPI uses trusted publishing (OIDC, no token): the project "hexcli" on
# PyPI lists this repository, this file and the "pypi" environment as its
# publisher. Nothing else has credentials.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (vX.Y.Z)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches hexcli.__version__
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          v="v$(python -c 'import hexcli; print(hexcli.__version__)')"
          if [ "$v" != "$tag" ]; then
            echo "tag $tag but hexcli.__version__ is $v"
            exit 1
          fi

      - name: Build
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hexcli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
